site_name: Shouss's Notes
site_url: https://note.shouss.top
site_description: Shouss 的课程与研究笔记，从概念、论文到实现。
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search:
      # 搜索框会给查询词追加 * 通配符，而 lunr 的通配符词项不经过词干化管道；
      # 若索引侧保留 stemmer（中文主题默认），ARIES 这类词将永远搜不到。
      # 置空 pipeline 让索引保留 jieba 分词的原始 token，通配符前缀匹配两侧一致。
      pipeline: []
  - mermaid2:
      version: 10.4.0
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/reading.js
extra_css:
  - stylesheets/reading.css
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn
nav:
  - 首页: index.md
  - 视频生成:
    - 学习地图: research/video_generation/index.md
    - 基础:
      - 01 · Diffusion 与 Flow Matching: research/video_generation/diffusion_flow.md
      - 02 · Transformer 与 DiT: research/video_generation/transformer_dit.md
      - 03 · VAE 与视频潜空间: research/video_generation/video_vae.md
    - 模型:
      - 04 · HunyuanVideo 与 Wan: research/video_generation/architectures.md
      - 05 · MiniMax-H3: research/video_generation/minimax_h3.md
      - 06 · 对比与自测: research/video_generation/comparison_lab.md
    - 阅读材料:
      - 论文导读: research/video_generation/paper_reading.md
      - 视频课程与讲座: research/video_generation/video_courses.md
      - 论文与图源: research/video_generation/sources.md
    - 进阶:
      - HunyuanVideo 源码与数学推导: research/video_generation/hunyuan_video.md
      - 自回归视频扩散推理效率: research/video_generation/ar_video_diffusion_efficiency.md
  - CMU 15-445:
    - 总览: cmu_15_445/index.md
    - Query Execution: cmu_15_445/query_execution.md
    - Database Logging: cmu_15_445/data_logging.md
    - Recovery with ARIES: cmu_15_445/recovery_with_aries.md
  - ZJU:
    - 课程总览: zju/index.md
    - 马克思主义基本原理:
      - 总览: zju/marxism_basic_principles/index.md
      - 期末考试事项: zju/marxism_basic_principles/final_exam.md
    - 经济法:
      - 总览: zju/economic_law/index.md
      - 期末考试事项: zju/economic_law/final_exam.md
    - 数据库系统:
      - 总览: zju/database_system/index.md
      - 期末总复习: zju/database_system/final_review.md
    - 图像信息处理:
      - 总览: zju/digital_image_processing/index.md
      - 期末重点复习: zju/digital_image_processing/final_review.md
      - 23-24 Fall 试题解析: zju/digital_image_processing/23_24_fall_exam.md
      - 高频考点汇总: zju/digital_image_processing/high_probability_topics.md
      - Mock Exam: zju/digital_image_processing/mock_exam.md
      - 历年试题:
        - 2020–2021: zju/digital_image_processing/20-21.md
        - 2021–2022: zju/digital_image_processing/21-22.md
        - 2022–2023: zju/digital_image_processing/22-23final.md
    - 计算理论:
      - 总览: zju/theory_of_computation/index.md
